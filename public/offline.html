<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Offline · BestScreenTester</title>
    <style>
      /* Served by the service worker for a page that wasn't saved for offline use. */
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0a0b0f;
        color: #e8eaed;
        font: 16px/1.6 system-ui, sans-serif;
      }
      main {
        max-width: 30rem;
        padding: 2rem 1rem;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: rgba(232, 234, 237, 0.7);
      }
      a {
        color: #f27ba3;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page wasn't saved for offline use. Every screen test was, so they still work without a connection.</p>
      <p><a href="/tools/">Open the screen tests →</a></p>
    </main>
  </body>
</html>
